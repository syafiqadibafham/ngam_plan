name: ngam_plan
description: "An application to track your important events like anniversaries,
  birthdays, and more. Never miss an important date again!"

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.2+1

environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  elegant_nav_bar: ^0.0.22
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_bloc: ^8.1.6
  flutter_gen: ^5.12.0
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  go_router: ^17.0.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  jiffy: ^6.4.4
  json_annotation: ^4.9.0
  lucide_icons_flutter: ^3.1.4
  shimmer: ^3.0.0
  smooth_sheets: ^0.15.0
  soft_edge_blur: ^0.1.3
  supabase_flutter: ^2.12.0

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path_android: assets/images/app_icon.png
  image_path_ios: assets/images/app_icon_ios.png
  remove_alpha_ios: true
